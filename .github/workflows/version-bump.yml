name: Auto Bump Version and Tag

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: last-arc-version-bump
  cancel-in-progress: false

jobs:
  bump-version:
    name: Validate and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm run test:run

      - name: Build application
        run: npm run build

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          if [[ "$COMMIT_MSG" == *"#major"* ]]; then
            BUMP_TYPE="major"
          elif [[ "$COMMIT_MSG" == *"#minor"* ]]; then
            BUMP_TYPE="minor"
          else
            BUMP_TYPE="patch"
          fi

          echo "type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
          echo "Selected version bump: $BUMP_TYPE"

      - name: Update package version
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          npm version "$BUMP_TYPE" --no-git-tag-version

          NEW_VERSION=$(node -p "require('./package.json').version")
          NEW_TAG="v${NEW_VERSION}"

          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_TAG"

      - name: Commit and tag release
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add package.json package-lock.json

          git commit -m \
            "chore(release): bump version to ${NEW_TAG} [skip ci]"

          git tag "$NEW_TAG"

      - name: Publish release commit and tag
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch origin main

          if [ "$(git rev-parse HEAD^)" != \
               "$(git rev-parse origin/main)" ]; then
            echo "Main changed during release preparation."
            echo "Refusing to publish a stale release."
            exit 1
          fi

          git push --atomic origin HEAD:main "refs/tags/${NEW_TAG}"