name: Auto Bump Version and Tag

on:
  push:
    branches:
      - main
    # Prevent infinite workflow loops when the bot pushes the version commit
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history is required to read existing git tags
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git Committer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Reads commit message. If it contains "#major" or "#minor", bumps accordingly.
      # Default fallback bumps patch (0.3.3 -> 0.3.4).
      - name: Bump Version in package.json
        id: version_bump
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" =~ "#major" ]]; then
            BUMP_TYPE="major"
          elif [[ "$COMMIT_MSG" =~ "#minor" ]]; then
            BUMP_TYPE="minor"
          else
            BUMP_TYPE="patch"
          fi

          # npm version automatically creates a git commit and tag
          NEW_TAG=$(npm version $BUMP_TYPE -m "chore(release): bump version to %s [skip ci]")
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Created new version tag: $NEW_TAG"

      - name: Push Commit and Tag to GitHub
        run: |
          git push origin main
          git push origin $NEW_TAG

      # Optional: Run the build check to make sure TS passes with the new tag
      - name: Install & Build Check
        run: |
          npm ci
          npm run build
        env:
          GITHUB_REF_NAME: ${{ env.NEW_TAG }}
